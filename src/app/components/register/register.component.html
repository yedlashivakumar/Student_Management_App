<div class="container mt-5">
    <h2>Register</h2>
    <form (ngSubmit)="register()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" [(ngModel)]="username" name="username" class="form-control" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Retype Password</label>
        <input type="password" [(ngModel)]="retypePassword" name="retypePassword" class="form-control" required>
      </div>
  
      <div *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</div>
  
      <button class="btn btn-success" type="submit">Register</button>
      <button class="btn btn-secondary ms-2" type="button" (click)="goToLogin()">Back to Login</button>
    </form>
  </div>
